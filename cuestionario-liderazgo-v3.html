<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario de Estilos de Liderazgo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1em;
            opacity: 0.95;
        }

        .content {
            padding: 40px;
        }

        .progress-text {
            text-align: center;
            color: #667eea;
            font-size: 1em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.3s ease;
        }

        .question-container {
            display: none;
        }

        .question-container.active {
            display: block;
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .option-btn {
            padding: 18px 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
            cursor: pointer;
            text-align: left;
            font-size: 1.05em;
            color: #333;
            transition: all 0.2s ease;
            line-height: 1.5;
        }

        .option-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-prev {
            background: #e0e0e0;
            color: #333;
        }

        .btn-prev:hover:not(:disabled) {
            background: #d0d0d0;
        }

        .btn-prev:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-next:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* RESULTADOS */
        .results {
            display: none;
        }

        .results.active {
            display: block;
        }

        .result-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .result-title h2 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .main-result {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
        }

        .main-result h3 {
            font-size: 2em;
            margin-bottom: 15px;
        }

        .main-result p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .secondary-results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .secondary-result {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .secondary-result h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .secondary-result p {
            color: #666;
        }

        .description {
            background: #f0f4ff;
            padding: 25px;
            border-radius: 8px;
            border-left: 5px solid #667eea;
            margin-bottom: 30px;
            line-height: 1.7;
            color: #333;
        }

        .description h4 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .characteristics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .char {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
        }

        .char strong {
            color: #667eea;
            display: block;
            margin-bottom: 8px;
        }

        .char span {
            color: #666;
            font-size: 0.95em;
        }

        .scores {
            background: white;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 2px solid #f0f0f0;
        }

        .scores h4 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .score-item {
            margin-bottom: 18px;
        }

        .score-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .score-bar {
            background: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        .recommendations {
            background: #fffbf0;
            padding: 25px;
            border-radius: 8px;
            border-left: 5px solid #ff9800;
            margin-bottom: 30px;
        }

        .recommendations h4 {
            color: #ff9800;
            margin-bottom: 15px;
        }

        .recommendations ul {
            list-style: none;
        }

        .recommendations li {
            padding: 10px 0 10px 25px;
            color: #333;
            border-bottom: 1px solid #ffe0b2;
            position: relative;
        }

        .recommendations li:last-child {
            border-bottom: none;
        }

        .recommendations li:before {
            content: "→";
            position: absolute;
            left: 0;
            color: #ff9800;
            font-weight: bold;
        }

        .btn-restart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            font-size: 1.05em;
            margin: 30px auto;
            display: block;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
        }

        .btn-restart:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }

            .secondary-results {
                grid-template-columns: 1fr;
            }

            .characteristics {
                grid-template-columns: 1fr;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Cuestionario de Estilos de Liderazgo</h1>
            <p>Para Jefes de Área - Descubre tu enfoque de liderazgo</p>
        </div>

        <div class="content">
            <!-- PREGUNTAS -->
            <div id="quiz-section">
                <div class="progress-text">
                    Pregunta <span id="pregunta-actual">1</span> de 20
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="barra-progreso"></div>
                </div>

                <div id="preguntas-container"></div>

                <div class="buttons">
                    <button class="btn-prev" id="btn-anterior" onclick="preguntaAnterior()" disabled>← Anterior</button>
                    <button class="btn-next" id="btn-siguiente" onclick="preguntaSiguiente()" disabled>Siguiente →</button>
                </div>
            </div>

            <!-- RESULTADOS -->
            <div id="resultados-section" class="results">
                <div class="result-title">
                    <h2>📊 Tus Resultados</h2>
                </div>

                <div class="main-result">
                    <h3 id="titulo-principal">Estilo de Liderazgo</h3>
                    <p id="subtitulo-principal">Tu enfoque principal</p>
                </div>

                <div class="secondary-results" id="resultados-secundarios"></div>

                <div class="description">
                    <h4 id="titulo-descripcion">Tu Perfil</h4>
                    <p id="texto-descripcion"></p>
                </div>

                <div class="characteristics" id="caracteristicas-container"></div>

                <div class="recommendations">
                    <h4>📌 Recomendaciones</h4>
                    <ul id="recomendaciones-lista"></ul>
                </div>

                <div class="scores">
                    <h4>📈 Puntuaciones Detalladas</h4>
                    <div id="puntuaciones-container"></div>
                </div>

                <button class="btn-restart" onclick="reiniciar()">Repetir Cuestionario</button>
            </div>
        </div>
    </div>

    <script>
        const preguntas = [
            {
                texto: "Cuando tu equipo enfrenta un problema complejo sin solución clara, ¿cuál es tu primer instinto?",
                opciones: [
                    { texto: "Reúno al equipo para explorar juntos todas las perspectivas antes de decidir", puntos: { transformacional: 3, democrático: 3, colaborativo: 2 } },
                    { texto: "Analizo la situación en profundidad y presento una solución bien fundamentada", puntos: { directivo: 3, analítico: 3, visión: 1 } },
                    { texto: "Dejo que el equipo proponga soluciones y elijo la mejor opción", puntos: { democrático: 3, delegativo: 2, colaborativo: 1 } },
                    { texto: "Establezco la dirección clara pero dejo libertad en la ejecución", puntos: { transformacional: 2, visión: 3, colaborativo: 1 } }
                ]
            },
            {
                texto: "Un miembro talentoso de tu equipo propone una idea innovadora que desafía los procesos actuales. ¿Cómo reaccionas?",
                opciones: [
                    { texto: "Lo analizo críticamente antes de adoptar; debo evaluar viabilidad y riesgos", puntos: { analítico: 3, directivo: 2, cauto: 2 } },
                    { texto: "Entusiasta, lo apoyo y ayudo a implementarlo; la innovación es clave", puntos: { transformacional: 3, visión: 3, colaborativo: 1 } },
                    { texto: "Le pido que lo desarrolle y presente ante el equipo para discusión conjunta", puntos: { democrático: 3, colaborativo: 2, delegativo: 1 } },
                    { texto: "Valido la idea pero considerando cómo se integra con metas organizacionales", puntos: { estratégico: 3, visión: 2, analítico: 1 } }
                ]
            },
            {
                texto: "Tu jefe presiona por resultados mientras tu equipo está al máximo de su capacidad. ¿Cuál es tu enfoque?",
                opciones: [
                    { texto: "Negoció con la jefatura basándome en datos para ajustar expectativas realistas", puntos: { estratégico: 3, negociador: 2, protector: 2 } },
                    { texto: "Motivo al equipo explicando la importancia y cómo juntos podemos lograrlo", puntos: { transformacional: 3, inspirador: 3, visión: 1 } },
                    { texto: "Distribuyo la carga equitativamente y monitoreo progreso constantemente", puntos: { directivo: 3, analítico: 2, cauto: 1 } },
                    { texto: "Pregunto al equipo cómo podemos organizarnos mejor para lograr los resultados", puntos: { democrático: 3, colaborativo: 2, delegativo: 1 } }
                ]
            },
            {
                texto: "Notas que dos miembros de tu equipo tienen conflicto que afecta la dinámica. ¿Qué haces?",
                opciones: [
                    { texto: "Me reúno con cada uno privadamente para entender raíces del problema", puntos: { empático: 3, mediador: 3, protector: 1 } },
                    { texto: "Reúno a ambos, medío y busco solución que sea justa para los dos", puntos: { democrático: 2, mediador: 3, empático: 1 } },
                    { texto: "Establezco expectativas claras sobre comportamiento profesional y monitoreo", puntos: { directivo: 3, cauto: 2, analítico: 1 } },
                    { texto: "Veo esto como oportunidad para fortalecer la empatía y cohesión del equipo", puntos: { transformacional: 2, empático: 2, mediador: 2 } }
                ]
            },
            {
                texto: "A nivel estratégico, ¿cómo visualizas tu rol en la organización?",
                opciones: [
                    { texto: "Ejecutor eficiente de las estrategias establecidas por niveles superiores", puntos: { directivo: 3, operativo: 3, cauto: 1 } },
                    { texto: "Catalizador que alinea la visión organizacional con las capacidades del equipo", puntos: { transformacional: 3, estratégico: 2, visión: 2 } },
                    { texto: "Facilitador que potencia el talento del equipo para que emerja lo mejor de cada uno", puntos: { delegativo: 3, colaborativo: 2, empático: 1 } },
                    { texto: "Pensador estratégico que define dirección con base en análisis de mercado y capacidades", puntos: { analítico: 3, estratégico: 3, visión: 1 } }
                ]
            },
            {
                texto: "Un proyecto importante fracasó. ¿Cuál es tu respuesta?",
                opciones: [
                    { texto: "Analizo qué salió mal, qué aprendemos y cómo mejoramos procesos", puntos: { analítico: 3, aprendedor: 3, cauto: 1 } },
                    { texto: "Responsabilizo a quien corresponde y ajusto procesos para evitar repetición", puntos: { directivo: 3, cauto: 2, operativo: 1 } },
                    { texto: "Lo veo como experiencia de aprendizaje para fortalecer al equipo", puntos: { transformacional: 2, empático: 2, aprendedor: 2 } },
                    { texto: "Involucro al equipo en análisis para que todos aprendan juntos de la experiencia", puntos: { democrático: 3, colaborativo: 2, aprendedor: 1 } }
                ]
            },
            {
                texto: "¿Cuánto espacio das a tu equipo para tomar decisiones sin tu aprobación?",
                opciones: [
                    { texto: "Poco; prefiero revisar decisiones para asegurar alineación y consistencia", puntos: { directivo: 3, cauto: 2, analítico: 1 } },
                    { texto: "Considerable; establezco límites claros pero confío en su criterio", puntos: { delegativo: 3, estratégico: 1, confianza: 3 } },
                    { texto: "Mucho; mi trabajo es potenciar su capacidad de decisión", puntos: { delegativo: 3, empático: 2, confianza: 2 } },
                    { texto: "Variable según la importancia de la decisión y madurez del equipo", puntos: { estratégico: 3, analítico: 2, confianza: 1 } }
                ]
            },
            {
                texto: "Tu equipo tiene personas muy jóvenes (entrada a carrera) y muy experimentadas (próximas a jubilación). ¿Tu enfoque?",
                opciones: [
                    { texto: "Estructuro programas de mentoría para transferencia de conocimiento", puntos: { transformacional: 3, empático: 2, aprendedor: 2 } },
                    { texto: "Asigno roles según experiencia y facilito crecimiento de jóvenes talentos", puntos: { estratégico: 3, delegativo: 2, visión: 1 } },
                    { texto: "Establezco estándares claros de desempeño y monitoreo para todos", puntos: { directivo: 3, operativo: 2, cauto: 1 } },
                    { texto: "Busco que el equipo mismo organice la colaboración intergeneracional", puntos: { democrático: 3, colaborativo: 2, delegativo: 1 } }
                ]
            },
            {
                texto: "Cuando las cosas van bien, ¿cómo reconoces y celebras los logros?",
                opciones: [
                    { texto: "Reconocimiento inmediato, específico y visible; celebro como equipo", puntos: { transformacional: 3, inspirador: 3, empático: 1 } },
                    { texto: "Reconozco logros en conversaciones privadas, reforzando comportamientos clave", puntos: { empático: 3, protector: 2, directivo: 1 } },
                    { texto: "Hago público el reconocimiento para que inspire a otros", puntos: { inspirador: 3, transformacional: 2, visión: 1 } },
                    { texto: "Vinculo logros a beneficios/oportunidades de carrera para motivar futuro", puntos: { estratégico: 3, analítico: 2, directivo: 1 } }
                ]
            },
            {
                texto: "Un cambio organizacional importante viene de arriba. ¿Tu primer paso?",
                opciones: [
                    { texto: "Lo analizo para entender impacto y comunico con claridad a mi equipo", puntos: { analítico: 3, comunicador: 2, cauto: 2 } },
                    { texto: "Entiendo la visión detrás del cambio y la presento de manera inspiradora", puntos: { transformacional: 3, inspirador: 3, visión: 1 } },
                    { texto: "Involucro al equipo para entender preocupaciones y co-diseñar implementación", puntos: { democrático: 3, colaborativo: 2, comunicador: 1 } },
                    { texto: "Establezco plan de implementación claro con roles, timing y métricas", puntos: { directivo: 3, operativo: 3, estratégico: 1 } }
                ]
            },
            {
                texto: "¿Cómo ves el balance entre cumplimiento de objetivos y bienestar del equipo?",
                opciones: [
                    { texto: "Son inseparables; un equipo con bienestar logra objetivos sosteniblemente", puntos: { transformacional: 3, empático: 3, balanceado: 2 } },
                    { texto: "Prioridad primaria son objetivos; bienestar es consecuencia de logros", puntos: { directivo: 3, operativo: 2, cauto: 1 } },
                    { texto: "Busco equilibrio constante; ambos son igualmente importantes", puntos: { estratégico: 3, balanceado: 3, colaborativo: 1 } },
                    { texto: "Creo que el equipo sabe qué necesita; facilito ambas cosas", puntos: { democrático: 3, delegativo: 2, empático: 1 } }
                ]
            },
            {
                texto: "Un cliente importante hizo queja sobre tu área. ¿Tu reacción?",
                opciones: [
                    { texto: "Investigo a fondo la raíz del problema y presento plan de corrección", puntos: { analítico: 3, estratégico: 2, cauto: 2 } },
                    { texto: "Tomo responsabilidad inmediatamente y corrijo con el equipo", puntos: { directivo: 3, protector: 2, operativo: 1 } },
                    { texto: "Lo veo como oportunidad para mejorar y fortalecer procesos con el equipo", puntos: { transformacional: 2, aprendedor: 3, colaborativo: 1 } },
                    { texto: "Reúno al equipo para entender qué pasó y definir juntos la solución", puntos: { democrático: 3, colaborativo: 2, empático: 1 } }
                ]
            },
            {
                texto: "¿Cuál es tu relación típica con el riesgo?",
                opciones: [
                    { texto: "Evito riesgos; prefiero caminos probados y seguros", puntos: { cauto: 3, analítico: 2, directivo: 1 } },
                    { texto: "Los evalúo cuidadosamente; asumo riesgos calculados", puntos: { analítico: 3, estratégico: 2, balanceado: 1 } },
                    { texto: "Veo riesgos como oportunidades; el crecimiento requiere cierta audacia", puntos: { transformacional: 3, visión: 3, innovador: 1 } },
                    { texto: "Dejo que el equipo evalúe y decida; soporto decisiones bien pensadas", puntos: { delegativo: 3, confianza: 2, colaborativo: 1 } }
                ]
            },
            {
                texto: "Un miembro del equipo tiene problemas personales que afecta su desempeño. ¿Qué haces?",
                opciones: [
                    { texto: "Lo hablo confidencialmente; entiendo el problema y busco apoyo disponible", puntos: { empático: 3, protector: 3, humano: 2 } },
                    { texto: "Establezco con claridad expectativas de desempeño y opciones de apoyo", puntos: { directivo: 2, cauto: 2, empático: 2 } },
                    { texto: "Conecto la persona con recursos (RRHH, servicios de salud) y muestro paciencia", puntos: { protector: 3, empático: 2, humano: 2 } },
                    { texto: "Facilito que el equipo apoye al compañero mientras se resuelve la situación", puntos: { colaborativo: 3, democrático: 2, empático: 1 } }
                ]
            },
            {
                texto: "¿Qué tipo de feedback buscas sobre tu liderazgo?",
                opciones: [
                    { texto: "Feedback directo y honesto; quiero saber exactamente dónde mejorar", puntos: { aprendedor: 3, transformacional: 2, comunicador: 1 } },
                    { texto: "Metrics de desempeño del equipo; esos son mis mejores indicadores", puntos: { analítico: 3, operativo: 2, directivo: 1 } },
                    { texto: "Observaciones sobre el clima, motivación y cohesión del equipo", puntos: { empático: 3, transformacional: 2, humano: 2 } },
                    { texto: "Reflexiono con el equipo; sus percepciones son clave en mi desarrollo", puntos: { democrático: 3, aprendedor: 2, colaborativo: 1 } }
                ]
            },
            {
                texto: "La organización necesita un cambio cultural. ¿Tu enfoque?",
                opciones: [
                    { texto: "Modelo el cambio, inspiro al equipo a vivirlo y celebro pequeños avances", puntos: { transformacional: 3, inspirador: 3, visión: 1 } },
                    { texto: "Establezco nuevas normas y políticas; los comportamientos seguirán", puntos: { directivo: 3, operativo: 2, cauto: 1 } },
                    { texto: "Facilito conversaciones para que el equipo entienda por qué y cómo", puntos: { democrático: 3, comunicador: 2, colaborativo: 1 } },
                    { texto: "Analizo la brecha actual vs. deseada y diseño intervenciones estratégicas", puntos: { estratégico: 3, analítico: 3, visión: 1 } }
                ]
            },
            {
                texto: "¿Cómo describes tu disponibilidad y accesibilidad para el equipo?",
                opciones: [
                    { texto: "Muy accesible; quiero que me busquen cuando me necesiten", puntos: { empático: 3, protector: 2, humano: 2 } },
                    { texto: "Disponible, pero dentro de límites claros de tiempo y proceso", puntos: { estratégico: 3, directivo: 2, operativo: 1 } },
                    { texto: "Accesible, pero enfatizo que el equipo resuelva primero antes de recurrir a mí", puntos: { delegativo: 3, confianza: 3, aprendedor: 1 } },
                    { texto: "Mi agenda es flexible según necesidades del equipo y negocio", puntos: { balanceado: 3, colaborativo: 2, estratégico: 1 } }
                ]
            },
            {
                texto: "En conflictos entre objetivos de tu área vs. otras áreas, ¿cuál es tu postura?",
                opciones: [
                    { texto: "Defiendo el interés de mi área de manera firme pero colaborativa", puntos: { negociador: 3, estratégico: 2, protector: 1 } },
                    { texto: "Busco entender la perspectiva de otros y encontrar soluciones ganar-ganar", puntos: { democrático: 3, mediador: 3, colaborativo: 1 } },
                    { texto: "Priorizo el bien general de la organización sobre mi área", puntos: { estratégico: 3, visión: 2, transformacional: 1 } },
                    { texto: "Presento datos que demuestren por qué mi área debe priorizar", puntos: { analítico: 3, cauto: 2, directivo: 1 } }
                ]
            },
            {
                texto: "¿Cómo definiría tu éxito como líder?",
                opciones: [
                    { texto: "Que mi equipo logre resultados exceptionales de forma consistente", puntos: { directivo: 3, operativo: 3, cauto: 1 } },
                    { texto: "Que mi equipo desarrolle líderes que puedan reemplazarme o ir más lejos", puntos: { transformacional: 3, visión: 3, aprendedor: 1 } },
                    { texto: "Que mi equipo se sienta comprometido, apreciado y en crecimiento", puntos: { empático: 3, transformacional: 2, humano: 2 } },
                    { texto: "Que el equipo ejecute estrategia con autonomía y criterio propio", puntos: { delegativo: 3, estratégico: 2, confianza: 1 } }
                ]
            }
        ];

        const perfiles = {
            transformacional: {
                nombre: "Líder Transformacional",
                descripcion: "Eres un líder visionario que inspira cambio y desarrollo personal en tu equipo. Tu enfoque se centra en elevar el potencial de las personas, articular una visión clara y motivar a través del ejemplo.",
                fortalezas: [
                    { nombre: "Visión Clara", desc: "Articulas dirección inspiradora para el equipo" },
                    { nombre: "Inspiración", desc: "Motivas a otros a superar sus límites" },
                    { nombre: "Desarrollo Humano", desc: "Inviertes en crecimiento de tu gente" },
                    { nombre: "Agilidad Adaptativa", desc: "Te adaptas bien a cambios y los impulsa" }
                ],
                recomendaciones: [
                    "Equilibra visión inspiradora con métricas concretas de progreso",
                    "Comunica el 'cómo' además del 'qué' y el 'por qué'",
                    "Delega más en equipos maduras para no crear dependencia",
                    "Mantén contacto con realidades operativas del día a día"
                ]
            },
            directivo: {
                nombre: "Líder Directivo",
                descripcion: "Eres un líder orientado a resultados que valora la claridad, eficiencia y ejecución. Tu enfoque es establecer expectativas claras, monitorear progreso y asegurar que los objetivos se cumplan.",
                fortalezas: [
                    { nombre: "Orientación a Resultados", desc: "Enfoque claro en objetivos y cumplimiento" },
                    { nombre: "Claridad", desc: "Comunicas expectativas con precisión" },
                    { nombre: "Eficiencia Operativa", desc: "Optimizas procesos y recursos" },
                    { nombre: "Responsabilidad", desc: "Asumes y demandas accountability" }
                ],
                recomendaciones: [
                    "Incrementa escucha activa; no todo está en las métricas",
                    "Crea espacios para que el equipo proponga mejoras",
                    "Trabaja en reconocimiento más frecuente de logros",
                    "Explora el 'por qué' detrás de los objetivos"
                ]
            },
            democrático: {
                nombre: "Líder Democrático/Colaborativo",
                descripcion: "Eres un líder que valora la participación, la inclusión y la construcción conjunta. Tu fortaleza está en facilitar que el equipo se sienta escuchado y se apropie de resultados.",
                fortalezas: [
                    { nombre: "Inclusión", desc: "Todos se sienten parte de las decisiones" },
                    { nombre: "Apropiación Compartida", desc: "El equipo se compromete con resultados propios" },
                    { nombre: "Diversidad de Ideas", desc: "Aprovechas perspectivas distintas" },
                    { nombre: "Cohesión Grupal", desc: "Fortaleces vínculos y confianza en equipo" }
                ],
                recomendaciones: [
                    "Define límites claros de participación en decisiones rápidas",
                    "Asegura que participación no diluya accountability individual",
                    "Comunica decisiones finales con claridad aunque no haya consenso",
                    "Trabaja en tomar decisiones difíciles cuando el equipo está dividido"
                ]
            },
            delegativo: {
                nombre: "Líder Delegativo/Habilitador",
                descripcion: "Eres un líder que confía en la capacidad de tu equipo y les da autonomía para ejecutar. Tu fortaleza está en potenciar el desarrollo de tus colaboradores.",
                fortalezas: [
                    { nombre: "Confianza", desc: "Delegas con convicción en capacidades" },
                    { nombre: "Autonomía", desc: "Das libertad para que decidan cómo actuar" },
                    { nombre: "Desarrollo de Talento", desc: "Tu gente crece más rápido que el promedio" },
                    { nombre: "Escalabilidad", desc: "Tu modelo permite crecer sin multiplicar tu carga" }
                ],
                recomendaciones: [
                    "Asegura que el equipo entienda límites y restricciones reales",
                    "Proporciona claridad en el 'por qué' de las decisiones",
                    "Mantén visibilidad sobre riesgos sin micromanagear",
                    "Revisa ocasionalmente para asegurar que todos están siendo servidos bien"
                ]
            },
            analítico: {
                nombre: "Líder Analítico/Estratégico",
                descripcion: "Eres un líder que basa sus decisiones en datos, análisis profundo y pensamiento estratégico. Tu fortaleza está en entender la complejidad y diseñar soluciones fundamentadas.",
                fortalezas: [
                    { nombre: "Análisis Profundo", desc: "No aceptas soluciones superficiales" },
                    { nombre: "Visión Estratégica", desc: "Ves conexiones entre partes del negocio" },
                    { nombre: "Gestión de Riesgo", desc: "Anticipas problemas potenciales" },
                    { nombre: "Decisión Fundamentada", desc: "Tus decisiones se sostienen en el tiempo" }
                ],
                recomendaciones: [
                    "Acelera tiempo de análisis; a veces 70% de info es suficiente",
                    "Comunica la lógica detrás de decisiones para que el equipo entienda",
                    "Valida supuestos con el equipo; tu percepción puede no ser completa",
                    "Permite que otros experimenten aprendiendo, no solo analizando"
                ]
            },
            empático: {
                nombre: "Líder Empático/Humano",
                descripcion: "Eres un líder centrado en las personas, que valora entender sus necesidades, preocupaciones y potencial. Tu fortaleza está en crear ambientes seguros.",
                fortalezas: [
                    { nombre: "Escucha Activa", desc: "Entiendes lo que realmente dicen" },
                    { nombre: "Soporte Emocional", desc: "Tu equipo se siente cuidado" },
                    { nombre: "Retención de Talento", desc: "La gente quiere trabajar contigo" },
                    { nombre: "Resolución de Conflictos", desc: "Buscas soluciones que honren a todos" }
                ],
                recomendaciones: [
                    "Establece límites más claros; no puedes cargar con problemas de todos",
                    "Trabaja en dar feedback difícil con firmeza cuando sea necesario",
                    "Asegura que empatía no se traduzca en falta de accountability",
                    "Desarrolla separación saludable entre rol profesional y relaciones"
                ]
            }
        };

        let preguntaActual = 0;
        let respuestas = {};
        let puntuaciones = {
            transformacional: 0,
            directivo: 0,
            democrático: 0,
            delegativo: 0,
            analítico: 0,
            empático: 0
        };

        function iniciar() {
            renderizarPreguntas();
            actualizarProgreso();
        }

        function renderizarPreguntas() {
            const container = document.getElementById("preguntas-container");
            container.innerHTML = "";

            preguntas.forEach((pregunta, indice) => {
                const div = document.createElement("div");
                div.className = "question-container" + (indice === 0 ? " active" : "");
                div.id = "pregunta-" + indice;

                let opcionesHTML = '<div class="options">';
                pregunta.opciones.forEach((opcion, indiceOpcion) => {
                    opcionesHTML += `<button class="option-btn" onclick="seleccionarRespuesta(${indice}, ${indiceOpcion})">${opcion.texto}</button>`;
                });
                opcionesHTML += '</div>';

                div.innerHTML = `
                    <div class="question-number">Pregunta ${indice + 1}</div>
                    <div class="question-text">${pregunta.texto}</div>
                    ${opcionesHTML}
                `;

                container.appendChild(div);
            });
        }

        function seleccionarRespuesta(numPregunta, numOpcion) {
            respuestas[numPregunta] = numOpcion;
            
            const puntosPregunta = preguntas[numPregunta].opciones[numOpcion].puntos;
            for (const [perfil, puntos] of Object.entries(puntosPregunta)) {
                puntuaciones[perfil] += puntos;
            }

            // Resaltar opción seleccionada
            const botones = document.querySelectorAll(`#pregunta-${numPregunta} .option-btn`);
            botones.forEach((btn, i) => {
                btn.classList.remove("selected");
                if (i === numOpcion) {
                    btn.classList.add("selected");
                }
            });

            actualizarProgreso();
            activarBotones();
        }

        function actualizarProgreso() {
            const respondidas = Object.keys(respuestas).length;
            document.getElementById("pregunta-actual").textContent = respondidas;
            const porcentaje = (respondidas / preguntas.length) * 100;
            document.getElementById("barra-progreso").style.width = porcentaje + "%";
        }

        function activarBotones() {
            const respondidas = Object.keys(respuestas).length;
            document.getElementById("btn-siguiente").disabled = respondidas <= preguntaActual;
            document.getElementById("btn-anterior").disabled = preguntaActual === 0;
        }

        function preguntaSiguiente() {
            if (preguntaActual < preguntas.length - 1) {
                document.getElementById("pregunta-" + preguntaActual).classList.remove("active");
                preguntaActual++;
                document.getElementById("pregunta-" + preguntaActual).classList.add("active");
                actualizarProgreso();
                activarBotones();

                if (preguntaActual === preguntas.length - 1 && Object.keys(respuestas).length === preguntas.length) {
                    document.getElementById("btn-siguiente").textContent = "Ver Resultados →";
                }
            } else if (preguntaActual === preguntas.length - 1 && Object.keys(respuestas).length === preguntas.length) {
                mostrarResultados();
            }
        }

        function preguntaAnterior() {
            if (preguntaActual > 0) {
                document.getElementById("pregunta-" + preguntaActual).classList.remove("active");
                preguntaActual--;
                document.getElementById("pregunta-" + preguntaActual).classList.add("active");
                actualizarProgreso();
                activarBotones();
                document.getElementById("btn-siguiente").textContent = "Siguiente →";
            }
        }

        function mostrarResultados() {
            // Encontrar perfil principal
            let maxPuntos = 0;
            let perfilPrincipal = "";
            for (const [perfil, puntos] of Object.entries(puntuaciones)) {
                if (puntos > maxPuntos) {
                    maxPuntos = puntos;
                    perfilPrincipal = perfil;
                }
            }

            // Encontrar perfiles secundarios
            const ordenados = Object.entries(puntuaciones).sort((a, b) => b[1] - a[1]);
            const secundarios = ordenados.slice(1, 3);

            // Mostrar sección de resultados
            document.getElementById("quiz-section").style.display = "none";
            document.getElementById("resultados-section").classList.add("active");

            const datosPerfilPrincipal = perfiles[perfilPrincipal];
            document.getElementById("titulo-principal").textContent = datosPerfilPrincipal.nombre;
            document.getElementById("subtitulo-principal").textContent = `Puntuación: ${maxPuntos}`;
            document.getElementById("titulo-descripcion").textContent = datosPerfilPrincipal.nombre;
            document.getElementById("texto-descripcion").textContent = datosPerfilPrincipal.descripcion;

            // Características
            const caracteristicas = document.getElementById("caracteristicas-container");
            caracteristicas.innerHTML = datosPerfilPrincipal.fortalezas.map(f =>
                `<div class="char"><strong>${f.nombre}</strong><span>${f.desc}</span></div>`
            ).join("");

            // Recomendaciones
            document.getElementById("recomendaciones-lista").innerHTML = datosPerfilPrincipal.recomendaciones.map(r =>
                `<li>${r}</li>`
            ).join("");

            // Perfiles secundarios
            document.getElementById("resultados-secundarios").innerHTML = secundarios.map(([perfil, puntos]) => {
                const datosP = perfiles[perfil];
                return `<div class="secondary-result"><h4>${datosP.nombre}</h4><p>Puntuación: ${puntos}</p></div>`;
            }).join("");

            // Puntuaciones detalladas
            const puntuacionesDiv = document.getElementById("puntuaciones-container");
            puntuacionesDiv.innerHTML = Object.entries(puntuaciones).map(([perfil, puntos]) => {
                const datosP = perfiles[perfil];
                const maxPosible = 60;
                const porcentaje = (puntos / maxPosible) * 100;
                return `<div class="score-item">
                    <div class="score-label">
                        <span>${datosP.nombre}</span>
                        <span>${puntos}/${maxPosible}</span>
                    </div>
                    <div class="score-bar">
                        <div class="score-fill" style="width: ${porcentaje}%"></div>
                    </div>
                </div>`;
            }).join("");
        }

        function reiniciar() {
            preguntaActual = 0;
            respuestas = {};
            puntuaciones = {
                transformacional: 0,
                directivo: 0,
                democrático: 0,
                delegativo: 0,
                analítico: 0,
                empático: 0
            };

            document.getElementById("quiz-section").style.display = "block";
            document.getElementById("resultados-section").classList.remove("active");
            document.getElementById("btn-siguiente").textContent = "Siguiente →";

            // Limpiar selecciones
            document.querySelectorAll(".option-btn").forEach(btn => btn.classList.remove("selected"));
            document.querySelectorAll(".question-container").forEach(q => q.classList.remove("active"));
            document.getElementById("pregunta-0").classList.add("active");

            actualizarProgreso();
            activarBotones();
        }

        iniciar();
    </script>
</body>
