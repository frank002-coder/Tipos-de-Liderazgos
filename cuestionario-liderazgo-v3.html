<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico de Liderazgo — Jefaturas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --azul:    #1A2E4A;
            --oro:     #C9A84C;
            --teal:    #1E7B8A;
            --verde:   #2D7D46;
            --rojo:    #B03A2E;
            --lila:    #6B4C9A;
            --gris:    #4B5563;
            --claro:   #F4F7FA;
            --blanco:  #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--azul);
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background: var(--blanco);
            border-radius: 14px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        /* ── HEADER ── */
        .header {
            background: var(--azul);
            color: white;
            padding: 36px 30px 28px;
            text-align: center;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--teal), var(--oro), var(--teal));
        }
        .header h1 { font-size: 1.75em; font-weight: 700; margin-bottom: 6px; }
        .header p  { font-size: 0.92em; opacity: .85; }
        .badge {
            display: inline-block;
            background: var(--oro);
            color: var(--azul);
            font-size: 0.75em;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* ── CONTENIDO ── */
        .content { padding: 32px 28px; }

        /* ── PROGRESO ── */
        .progress-wrap { margin-bottom: 28px; }
        .progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.82em;
            color: var(--gris);
            margin-bottom: 8px;
            font-weight: 600;
        }
        .progress-bar {
            background: #E5E7EB;
            height: 7px;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--teal), var(--oro));
            transition: width .35s ease;
            border-radius: 4px;
        }

        /* ── PREGUNTA ── */
        .question-block { display: none; }
        .question-block.active { display: block; animation: fadeIn .25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .q-label {
            font-size: 0.78em;
            font-weight: 700;
            color: var(--teal);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .q-text {
            font-size: 1.18em;
            color: var(--azul);
            font-weight: 600;
            line-height: 1.55;
            margin-bottom: 22px;
        }

        /* ── OPCIONES ── */
        .options { display: flex; flex-direction: column; gap: 10px; }

        .opt {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 16px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            background: var(--claro);
            cursor: pointer;
            transition: all .18s ease;
            text-align: left;
            font-size: 0.98em;
            color: var(--azul);
            line-height: 1.5;
        }
        .opt:hover { border-color: var(--teal); background: #EDF6F8; }
        .opt.selected {
            border-color: var(--teal);
            background: var(--teal);
            color: white;
            font-weight: 600;
        }
        .opt-letter {
            min-width: 26px; height: 26px;
            border-radius: 50%;
            border: 2px solid currentColor;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8em;
            font-weight: 700;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* ── NAVEGACIÓN ── */
        .nav {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }
        .btn-prev, .btn-next {
            flex: 1;
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95em;
            cursor: pointer;
            transition: all .2s;
        }
        .btn-prev {
            background: #E5E7EB;
            color: var(--gris);
        }
        .btn-prev:hover:not(:disabled) { background: #D1D5DB; }
        .btn-prev:disabled { opacity: .4; cursor: not-allowed; }

        .btn-next {
            background: var(--azul);
            color: white;
        }
        .btn-next:hover:not(:disabled) { background: var(--teal); }
        .btn-next:disabled { opacity: .4; cursor: not-allowed; }

        /* ── RESULTADOS ── */
        #results-section { display: none; }
        #results-section.active { display: block; }

        .result-hero {
            background: var(--azul);
            color: white;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            margin-bottom: 24px;
        }
        .result-hero .tipo-badge {
            display: inline-block;
            background: var(--oro);
            color: var(--azul);
            font-size: 0.72em;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .result-hero h2 { font-size: 1.9em; margin-bottom: 8px; }
        .result-hero .tagline { font-size: 0.95em; opacity: .85; }

        /* DIMENSIONES */
        .dims-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }
        .dim-card {
            border-radius: 10px;
            padding: 16px;
            border: 2px solid #E5E7EB;
        }
        .dim-card .dim-name {
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: var(--gris);
        }
        .dim-card .dim-valor {
            font-size: 1.15em;
            font-weight: 700;
            color: var(--azul);
            margin-bottom: 4px;
        }
        .dim-card .dim-desc {
            font-size: 0.82em;
            color: var(--gris);
            line-height: 1.4;
        }
        .dim-card.high { border-color: var(--teal); background: #EDF8FA; }
        .dim-card.high .dim-name { color: var(--teal); }

        /* BARRAS */
        .scores-section {
            background: var(--claro);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 24px;
        }
        .scores-section h3 {
            font-size: 0.9em;
            font-weight: 700;
            color: var(--azul);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .score-row { margin-bottom: 14px; }
        .score-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 0.88em;
        }
        .score-name { font-weight: 600; color: var(--azul); }
        .score-pct  { color: var(--gris); }
        .score-bar  { background: #DDE2E8; height: 8px; border-radius: 4px; overflow: hidden; }
        .score-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }

        /* PERFIL NARRATIVO */
        .narrative {
            border-left: 4px solid var(--teal);
            background: #EDF8FA;
            padding: 20px 20px 18px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 24px;
        }
        .narrative h3 { font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: var(--teal); margin-bottom: 10px; }
        .narrative p  { font-size: 0.95em; color: var(--azul); line-height: 1.65; }

        /* FORTALEZAS Y CIEGAS */
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
        .col-card { border-radius: 10px; padding: 18px; }
        .col-card.verde { background: #EDF7F0; border: 2px solid var(--verde); }
        .col-card.rojo  { background: #FAEAEA; border: 2px solid var(--rojo); }
        .col-card h3 { font-size: 0.82em; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .col-card.verde h3 { color: var(--verde); }
        .col-card.rojo  h3 { color: var(--rojo); }
        .col-card ul { list-style: none; }
        .col-card li { font-size: 0.9em; color: var(--azul); padding: 7px 0; border-bottom: 1px solid rgba(0,0,0,.07); line-height: 1.4; }
        .col-card li:last-child { border-bottom: none; }
        .col-card li::before { margin-right: 6px; }
        .col-card.verde li::before { content: "✓"; color: var(--verde); font-weight: 700; }
        .col-card.rojo  li::before { content: "△"; color: var(--rojo); font-weight: 700; }

        /* RECOMENDACIONES */
        .recs {
            background: #FDF8EF;
            border-left: 4px solid var(--oro);
            border-radius: 0 10px 10px 0;
            padding: 20px;
            margin-bottom: 28px;
        }
        .recs h3 { font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; color: var(--gris); margin-bottom: 12px; }
        .recs ol { padding-left: 18px; }
        .recs li { font-size: 0.93em; color: var(--azul); padding: 6px 0; line-height: 1.5; }

        .btn-restart {
            width: 100%; padding: 15px;
            background: var(--azul); color: white;
            border: none; border-radius: 8px;
            font-size: 1em; font-weight: 700;
            cursor: pointer; transition: background .2s;
        }
        .btn-restart:hover { background: var(--teal); }

        @media (max-width: 600px) {
            .content { padding: 20px 16px; }
            .dims-grid, .two-col { grid-template-columns: 1fr; }
            .q-text { font-size: 1.05em; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div class="badge">DIAGNÓSTICO PSICOLÓGICO DE LIDERAZGO</div>
        <h1>🎯 ¿Cómo lideras realmente?</h1>
        <p>20 preguntas · 5 minutos · Descubre tu estilo de liderazgo</p>
    </div>

    <div class="content">

        <!-- QUIZ -->
        <div id="quiz-section">
            <div class="progress-wrap">
                <div class="progress-meta">
                    <span>Pregunta <span id="q-num">1</span> de 20</span>
                    <span id="q-pct">0% completado</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="prog-fill" style="width:0%"></div>
                </div>
            </div>

            <div id="questions-container"></div>

            <div class="nav">
                <button class="btn-prev" id="btn-prev" onclick="goBack()" disabled>← Anterior</button>
                <button class="btn-next" id="btn-next" onclick="goNext()" disabled>Siguiente →</button>
            </div>
        </div>

        <!-- RESULTADOS -->
        <div id="results-section">

            <div class="result-hero">
                <div class="tipo-badge" id="r-badge">Perfil</div>
                <h2 id="r-title">—</h2>
                <p class="tagline" id="r-tagline">—</p>
            </div>

            <div class="dims-grid" id="dims-grid"></div>

            <div class="narrative">
                <h3>Tu Perfil Psicológico</h3>
                <p id="r-narrative">—</p>
            </div>

            <div class="scores-section">
                <h3>📊 Puntaje por Dimensión</h3>
                <div id="scores-bars"></div>
            </div>

            <div class="two-col">
                <div class="col-card verde">
                    <h3>🟢 Fortalezas Clave</h3>
                    <ul id="r-strengths"></ul>
                </div>
                <div class="col-card rojo">
                    <h3>🔺 Puntos Ciegos</h3>
                    <ul id="r-blinds"></ul>
                </div>
            </div>

            <div class="recs">
                <h3>📌 Recomendaciones Específicas</h3>
                <ol id="r-recs"></ol>
            </div>

            <button class="btn-restart" onclick="restart()">🔄 Repetir Diagnóstico</button>
        </div>

    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  DIMENSIONES PSICOLÓGICAS (8 ejes diferenciados)
//  Basado en: Blake/Mouton Grid, Big Five aplicado al liderazgo,
//  Teoría de Autodeterminación (Deci & Ryan), FIRO-B (Schutz),
//  Liderazgo Situacional (Hersey & Blanchard)
// ═══════════════════════════════════════════════════════
const DIMS = {
  tarea:      { label: "Orientación a la Tarea",     color: "#1E7B8A" },
  personas:   { label: "Orientación a las Personas",  color: "#2D7D46" },
  control:    { label: "Necesidad de Control",         color: "#B03A2E" },
  autonomia:  { label: "Delegación / Autonomía",       color: "#6B4C9A" },
  riesgo:     { label: "Tolerancia al Riesgo",         color: "#C9A84C" },
  reflexion:  { label: "Reflexión Crítica",            color: "#1A2E4A" },
  emocion:    { label: "Inteligencia Emocional",       color: "#0D7377" },
  influencia: { label: "Influencia / Inspiración",     color: "#8B5CF6" }
};

// ═══════════════════════════════════════════════════════
//  20 PREGUNTAS con 5 opciones cada una
//  Cada opción suma puntos a 2–3 dimensiones (sin mezcla total)
// ═══════════════════════════════════════════════════════
const QS = [
  {
    t: "Tu equipo enfrenta un problema sin solución clara. ¿Cuál es tu movimiento?",
    ops: [
      { t: "Convoco al equipo: necesito todas las perspectivas antes de decidir.", d: {personas:3, reflexion:2, emocion:1} },
      { t: "Analizo la situación en profundidad y llego con una propuesta bien fundamentada.", d: {tarea:2, reflexion:3, control:1} },
      { t: "Dejo que el equipo proponga y elijo la mejor opción según mi criterio.", d: {control:2, autonomia:2, tarea:1} },
      { t: "Establezco una dirección clara y dejo libertad en cómo ejecutarla.", d: {influencia:3, autonomia:2, tarea:1} },
      { t: "Busco referentes externos o benchmarks antes de actuar.", d: {reflexion:3, riesgo:2, tarea:1} }
    ]
  },
  {
    t: "Un talento en tu equipo propone una idea que desafía procesos actuales. Tú…",
    ops: [
      { t: "La analizo críticamente; primero evalúo viabilidad antes de entusiasmarme.", d: {tarea:2, reflexion:3, riesgo:-1} },
      { t: "La apoyo de inmediato; la innovación es parte del trabajo.", d: {influencia:3, riesgo:3, tarea:1} },
      { t: "Le pido que la presente al equipo para discusión colectiva.", d: {personas:3, autonomia:2, influencia:1} },
      { t: "La valido solo si se alinea con los objetivos institucionales.", d: {control:3, tarea:2, reflexion:1} },
      { t: "La escucho, pregunto cómo se siente al respecto y le ofrezco apoyo emocional.", d: {emocion:3, personas:3, influencia:1} }
    ]
  },
  {
    t: "Tu jefe presiona por resultados y tu equipo ya está al límite. ¿Qué haces?",
    ops: [
      { t: "Negocio con la jefatura usando datos para ajustar expectativas.", d: {reflexion:3, influencia:2, control:1} },
      { t: "Motivo al equipo; si entiendo el 'por qué', juntos podemos lograrlo.", d: {influencia:3, personas:2, emocion:1} },
      { t: "Distribuyo carga con precisión y monitoreo constantemente.", d: {tarea:3, control:3, personas:1} },
      { t: "Pregunto al equipo cómo reorganizarse; ellos saben mejor que yo.", d: {autonomia:3, personas:2, control:-1} },
      { t: "Absorbo trabajo extra yo mismo para proteger al equipo.", d: {personas:3, emocion:2, control:1} }
    ]
  },
  {
    t: "Dos personas de tu equipo tienen conflicto que afecta la dinámica. Tú…",
    ops: [
      { t: "Me reúno con cada uno por separado para entender las raíces.", d: {emocion:3, personas:3, reflexion:1} },
      { t: "Los reúno a los dos y medío en busca de una solución justa.", d: {personas:2, influencia:2, emocion:2} },
      { t: "Establezco expectativas claras de comportamiento y monitoreo el cumplimiento.", d: {control:3, tarea:2, personas:1} },
      { t: "Lo dejo resolver al equipo; son adultos profesionales.", d: {autonomia:3, riesgo:2, control:-1} },
      { t: "Uso el conflicto como oportunidad para un ejercicio de empatía grupal.", d: {emocion:3, influencia:2, personas:2} }
    ]
  },
  {
    t: "¿Cómo describes tu rol estratégico dentro de la organización?",
    ops: [
      { t: "Ejecuto eficientemente las estrategias que vienen de arriba.", d: {tarea:3, control:2, reflexion:1} },
      { t: "Traduzco la visión institucional en motivación para mi equipo.", d: {influencia:3, personas:2, tarea:1} },
      { t: "Potencio el talento; mi equipo es el protagonista, no yo.", d: {autonomia:3, personas:2, influencia:1} },
      { t: "Diseño la dirección con base en análisis y datos.", d: {reflexion:3, tarea:3, riesgo:1} },
      { t: "Gestiono relaciones clave para que mi equipo tenga lo que necesita.", d: {personas:3, emocion:2, influencia:2} }
    ]
  },
  {
    t: "Un proyecto importante fracasó. ¿Cuál es tu reacción real?",
    ops: [
      { t: "Analizo qué salió mal con datos; aprendo para no repetirlo.", d: {reflexion:3, tarea:2, riesgo:1} },
      { t: "Identifico responsabilidades y ajusto procesos de control.", d: {control:3, tarea:2, reflexion:1} },
      { t: "Lo vivo como equipo: aprendemos juntos y nos fortalecemos.", d: {personas:3, emocion:2, influencia:2} },
      { t: "Involucro al equipo en el análisis; quiero que todos extraigan la lección.", d: {personas:2, reflexion:2, autonomia:2} },
      { t: "Me cuesta manejarlo emocionalmente; lo proceso antes de actuar.", d: {emocion:3, reflexion:2, control:-1} }
    ]
  },
  {
    t: "¿Cuánta autonomía real le das a tu equipo para decidir?",
    ops: [
      { t: "Poca; reviso decisiones importantes para asegurar consistencia.", d: {control:3, tarea:2, autonomia:-2} },
      { t: "Alta; establezco límites claros pero confío en su criterio.", d: {autonomia:3, influencia:2, control:-1} },
      { t: "Total; empoderarlos es literalmente mi trabajo.", d: {autonomia:3, personas:2, control:-2} },
      { t: "Variable; depende de la madurez de cada persona.", d: {reflexion:3, autonomia:2, tarea:1} },
      { t: "Les doy autonomía, pero necesito saber qué está pasando siempre.", d: {control:2, autonomia:2, emocion:1} }
    ]
  },
  {
    t: "Tu equipo mezcla personas próximas a jubilarse y recién ingresados. Tu enfoque:",

      { t: "Armo programas de mentoría intergeneracional formales.", d: {personas:3, reflexion:2, influencia:2} },

      { t: "Dejo que se organicen solos; la diversidad se gestiona naturalmente.", d: {autonomia:3, riesgo:2, control:-1} },
      { t: "Hablo con cada perfil generacional por separado para entender sus necesidades.", d: {emocion:3, personas:3, reflexion:1} },

    ]
  },
  {
    t: "Cuando el equipo logra algo importante, ¿cómo celebras?",
    ops: [
      { t: "Reconocimiento inmediato, público y específico; celebro en grande.", d: {influencia:3, personas:2, emocion:2} },
      { t: "Reconocimiento privado; valoro más la conversación uno a uno.", d: {emocion:3, personas:2, control:1} },
      { t: "Lo vinculo a oportunidades concretas de carrera o crecimiento.", d: {tarea:3, influencia:2, reflexion:1} },
      { t: "Les dejo el mérito a ellos; yo solo facilité el camino.", d: {autonomia:3, personas:2, influencia:1} },
      { t: "Analizo qué salió bien para replicarlo sistemáticamente.", d: {reflexion:3, tarea:3, control:1} }
    ]
  },
  {
    t: "Llega un cambio organizacional importante desde arriba. Tu primer paso:",
    ops: [
      { t: "Lo analizo profundamente y comunico el impacto real a mi equipo.", d: {reflexion:3, tarea:2, personas:1} },
      { t: "Entiendo la visión detrás y la presento de manera que inspire.", d: {influencia:3, emocion:2, personas:1} },
      { t: "Involucro al equipo para que co-diseñe cómo implementarlo.", d: {autonomia:3, personas:2, emocion:1} },
      { t: "Armo un plan de implementación con roles, fechas y métricas.", d: {tarea:3, control:3, reflexion:1} },
      { t: "Primero valido cómo se siente el equipo antes de cualquier acción.", d: {emocion:3, personas:3, reflexion:1} }
    ]
  },
  {
    t: "¿Cómo ves la relación entre resultados y bienestar de tu equipo?",
    ops: [
      { t: "Son inseparables; el bienestar es condición para resultados sostenibles.", d: {personas:3, emocion:3, reflexion:1} },
      { t: "Los resultados son prioritarios; el bienestar es consecuencia natural.", d: {tarea:3, control:2, personas:-1} },
      { t: "Busco equilibrio activo; los dos son igual de importantes.", d: {reflexion:3, personas:2, tarea:2} },
      { t: "El equipo sabe qué necesita; facilito que ellos encuentren ese balance.", d: {autonomia:3, personas:2, emocion:1} },
      { t: "Depende del momento; en crisis priorizo resultados, en estabilidad priorizo bienestar.", d: {reflexion:3, riesgo:2, tarea:1} }
    ]
  },
  {
    t: "Un cliente o usuario importante presenta una queja grave sobre tu área. Tú…",
    ops: [
      { t: "Investigo la raíz del problema antes de reaccionar.", d: {reflexion:3, tarea:2, riesgo:1} },

// ─── STATE ───────────────────────────────────────────
let cur = 0;
let answers = {};
let scores = { tarea:0, personas:0, control:0, autonomia:0, riesgo:0, reflexion:0, emocion:0, influencia:0 };

// ─── BUILD QUESTIONS ─────────────────────────────────
function buildQuestions() {
  const c = document.getElementById('questions-container');
  c.innerHTML = '';
  QS.forEach((q, qi) => {
    const div = document.createElement('div');
    div.className = 'question-block' + (qi===0?' active':'');
    div.id = 'qb-'+qi;
    const letters = ['A','B','C','D','E'];
    let ops = q.ops.map((o,oi) => `
      <button class="opt" id="opt-${qi}-${oi}" onclick="pick(${qi},${oi})">
        <span class="opt-letter">${letters[oi]}</span>
        <span>${o.t}</span>
      </button>`).join('');
    div.innerHTML = `<div class="q-label">Pregunta ${qi+1} de ${QS.length}</div>
      <div class="q-text">${q.t}</div>
      <div class="options">${ops}</div>`;
    c.appendChild(div);
  });
}

function pick(qi, oi) {
  // Si ya respondió esta, restar
  if (answers[qi] !== undefined) {
    const prev = QS[qi].ops[answers[qi]].d;
    for (const [dim, pts] of Object.entries(prev)) {
      if (scores[dim] !== undefined) scores[dim] -= pts;
    }
    document.querySelectorAll(`#qb-${qi} .opt`).forEach(b => b.classList.remove('selected'));
  }
  answers[qi] = oi;
  const chosen = QS[qi].ops[oi].d;
  for (const [dim, pts] of Object.entries(chosen)) {
    if (scores[dim] !== undefined) scores[dim] += pts;
  }
  document.getElementById(`opt-${qi}-${oi}`).classList.add('selected');
  updateProgress();
  updateNav();
}

function updateProgress() {
  const done = Object.keys(answers).length;
  const pct = Math.round((done / QS.length) * 100);
  document.getElementById('q-num').textContent = done;
  document.getElementById('q-pct').textContent = pct + '% completado';
  document.getElementById('prog-fill').style.width = pct + '%';
}

function updateNav() {
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = answers[cur] === undefined;
  const isLast = cur === QS.length - 1;
  const allDone = Object.keys(answers).length === QS.length;
  document.getElementById('btn-next').textContent =
    (isLast && allDone) ? 'Ver mi Diagnóstico →' : 'Siguiente →';
}

function goNext() {
  if (cur < QS.length - 1) {
    document.getElementById('qb-'+cur).classList.remove('active');
    cur++;
    document.getElementById('qb-'+cur).classList.add('active');
    updateNav();
  } else if (Object.keys(answers).length === QS.length) {
    showResults();
  }
}

function goBack() {
  if (cur > 0) {
    document.getElementById('qb-'+cur).classList.remove('active');
    cur--;
    document.getElementById('qb-'+cur).classList.add('active');
    updateNav();
    document.getElementById('btn-next').textContent = 'Siguiente →';
  }
}

// ─── RESULTADOS ───────────────────────────────────────
function showResults() {
  // Encontrar perfil
  let profile = PROFILES.find(p => p.match(scores)) || PROFILES[PROFILES.length-1];

  // Ocultar quiz
  document.getElementById('quiz-section').style.display = 'none';
  document.getElementById('results-section').classList.add('active');

  // Hero
  document.getElementById('r-badge').textContent = profile.badge;
  document.getElementById('r-title').textContent = profile.nombre;
  document.getElementById('r-tagline').textContent = profile.tagline;
  document.getElementById('r-narrative').textContent = profile.narrative;

  // Dimensiones — top 4 destacadas
  const sorted = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const grid = document.getElementById('dims-grid');
  grid.innerHTML = sorted.map(([dim, val], i) => {
    const info = DIMS[dim];
    const isHigh = i < 2;
    const nivel = val >= 18 ? 'Muy alto' : val >= 13 ? 'Alto' : val >= 8 ? 'Medio' : 'En desarrollo';
    return `<div class="dim-card ${isHigh?'high':''}">
      <div class="dim-name">${info.label}</div>
      <div class="dim-valor">${nivel} (${val} pts)</div>
      <div class="dim-desc">${dimDesc(dim, val)}</div>
    </div>`;
  }).join('');

  // Barras
  const maxVal = Math.max(...Object.values(scores), 1);
  document.getElementById('scores-bars').innerHTML = sorted.map(([dim, val]) => {
    const info = DIMS[dim];
    const pct = Math.max(4, Math.round((val / 21) * 100));
    return `<div class="score-row">
      <div class="score-top">
        <span class="score-name">${info.label}</span>
        <span class="score-pct">${val} pts</span>
      </div>
      <div class="score-bar">
        <div class="score-fill" style="width:${pct}%;background:${info.color}"></div>
      </div>
    </div>`;
  }).join('');

  // Fortalezas / Puntos ciegos
  document.getElementById('r-strengths').innerHTML = profile.strengths.map(s=>`<li>${s}</li>`).join('');
  document.getElementById('r-blinds').innerHTML    = profile.blinds.map(b=>`<li>${b}</li>`).join('');

  // Recomendaciones
  document.getElementById('r-recs').innerHTML = profile.recs.map(r=>`<li>${r}</li>`).join('');
}

function dimDesc(dim, val) {
  const descs = {
    tarea:      val>=14 ? "Fuerte orientación al logro y los procesos." : "Equilibras tarea y personas.",
    personas:   val>=14 ? "Las relaciones son el núcleo de tu liderazgo." : "Cuidas al equipo pero mantienes foco en resultados.",
    control:    val>=14 ? "Alta necesidad de estructura y supervisión." : "Toleras bien la incertidumbre y la autonomía ajena.",
    autonomia:  val>=14 ? "Confías profundamente en la capacidad de otros." : "Balanceas dirección con delegación.",
    riesgo:     val>=12 ? "Alta tolerancia: ves el riesgo como oportunidad." : "Prefieres decisiones bien respaldadas.",
    reflexion:  val>=14 ? "Procesas profundamente antes de actuar." : "Balanceas reflexión con velocidad de acción.",
    emocion:    val>=14 ? "Alta inteligencia emocional; lees el equipo con precisión." : "Desarrollas tu dimensión emocional activamente.",
    influencia: val>=14 ? "Inspiras con facilidad; las personas te siguen con convicción." : "Tu influencia se basa más en la razón que en la emoción."
  };
  return descs[dim] || '';
}

function restart() {
  cur = 0; answers = {};
  scores = { tarea:0, personas:0, control:0, autonomia:0, riesgo:0, reflexion:0, emocion:0, influencia:0 };
  document.getElementById('results-section').classList.remove('active');
  document.getElementById('quiz-section').style.display = 'block';
  document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));
  document.querySelectorAll('.question-block').forEach(b=>b.classList.remove('active'));
  document.getElementById('qb-0').classList.add('active');
  updateProgress(); updateNav();
}

// ─── INIT ─────────────────────────────────────────────
buildQuestions();
updateProgress();
updateNav();
</script>
